name: ResearchCompanionApple
options:
  bundleIdPrefix: com.amerhwitat
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  ResearchCompanionApple:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.researchcompanion
        GENERATE_INFOPLIST_FILE: YES
  ResearchCompanionMac:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.researchcompanion.mac
        GENERATE_INFOPLIST_FILE: YES
