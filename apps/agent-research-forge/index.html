<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentResearchForge</title><style>body{font-family:system-ui;margin:0;background:#111;color:#eee}main{max-width:1100px;margin:auto;padding:24px}textarea{width:100%;min-height:130px;background:#1d1d1d;color:#fff;border:1px solid #555;padding:12px}button{padding:10px 16px;margin:8px 0}pre{white-space:pre-wrap;background:#181818;padding:16px;border-radius:8px}.source{padding:8px;border-left:3px solid #777;margin:8px 0}</style></head><body><main><h1>AgentResearchForge</h1><p>Research public web/library/document sources and generate reviewed project artifacts.</p><textarea id="q" placeholder="Ask a question, request research, or describe a project to build..."></textarea><select id="lang"><option>python</option><option>typescript</option><option>javascript</option><option>cpp</option><option>rust</option><option>go</option><option>java</option><option>csharp</option></select><br><button onclick="send()">Research / Build</button><input id="file" type="file"><button onclick="upload()">Import document</button><section id="out"></section></main><script>async function send(){const message=document.querySelector('#q').value;const language=document.querySelector('#lang').value;const r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message,language})});document.querySelector('#out').innerHTML='<pre>'+JSON.stringify(await r.json(),null,2).replaceAll('<','&lt;')+'</pre>'}async function upload(){const f=document.querySelector('#file').files[0];if(!f)return;const d=new FormData();d.append('file',f);const r=await fetch('/documents',{method:'POST',body:d});document.querySelector('#out').innerHTML='<pre>'+JSON.stringify(await r.json(),null,2)+'</pre>'}</script></body></html>
