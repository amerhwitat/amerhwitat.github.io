<!doctype html><html lang="en" dir="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Command Center</title><style>:root{--bg:#050b14;--p:#0b1727;--s:#203b59;--fg:#edf6ff;--m:#9ab0ca;--a:#63d6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 20% 0,#143b5e,transparent 65%),var(--bg);color:var(--fg);font:14px system-ui}main{max-width:1250px;margin:auto;padding:24px 18px 60px}.bar,.panel{border:1px solid var(--s);background:rgba(11,23,39,.82);backdrop-filter:blur(14px);border-radius:18px;padding:16px;margin-top:14px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input,.bar select{flex:1;min-width:180px;background:#07111f;color:var(--fg);border:1px solid var(--s);border-radius:10px;padding:10px}.btn{border:1px solid var(--s);background:#0c1c30;color:var(--fg);padding:9px 12px;border-radius:10px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.cmd{border:1px solid var(--s);border-radius:14px;padding:14px;background:#091525}.cmd b{font-size:18px}.alias{color:var(--a)}.muted{color:var(--m)}pre{white-space:pre-wrap;background:#03070d;border-radius:10px;padding:14px;min-height:90px;overflow:auto}small{color:var(--m)}</style><script src="portal-backend.js"></script></head><body><main><div class="bar"><a href="../index.html" class="btn">← Aurora</a><strong>⌘ Aurora Command Center</strong><select id="os"><option>Linux</option><option>Windows CMD</option><option>PowerShell</option><option>macOS</option></select><input id="q" placeholder="Search English or Arabic command…"><button class="btn" onclick="runTyped()">Run</button><button class="btn" onclick="nativeRun()">Run in Chimera</button></div><section class="panel"><div class="muted">SS64-derived catalog for Linux, Windows CMD/PowerShell and macOS. The catalog is regenerated during Pages deployment. Browser execution is sandboxed; native-only commands are handed to Chimera.</div><pre id="out">Ready. Try: عرض, اقرأ, اكتب, مسار, قائمة, احذف, بحث, تشغيل</pre></section><div id="grid" class="grid"></div></main><script>
let DATA=[],FS={".":"Welcome to Aurora Command Center."};const safe={pwd:()=>location.pathname,ls:()=>Object.keys(FS).filter(k=>k!==".").join("\\n")||"(empty)",dir:()=>Object.keys(FS).filter(k=>k!==".").join("\\n")||"(empty)",echo:a=>a.join(" "),printf:a=>a.join(" "),clear:()=>{out.textContent="";return""},cls:()=>{out.textContent="";return""},date:()=>new Date().toString(),whoami:()=>"aurora",uname:()=>"Chimera Aurora browser sandbox",ver:()=>navigator.userAgent,help:()=>Object.keys(safe).join("  "),cat:a=>FS[a[0]]||("cat: "+(a[0]||"")+" not found"),type:a=>FS[a[0]]||("TYPE: "+(a[0]||"")+" not found"),touch:a=>{(a||[]).forEach(x=>FS[x]="");return""},mkdir:a=>{(a||[]).forEach(x=>FS[x+"/"]="");return""},rm:a=>{(a||[]).forEach(x=>delete FS[x]);return""},del:a=>{(a||[]).forEach(x=>delete FS[x]);return""},cp:a=>{FS[a[1]]=FS[a[0]]||"";return""},copy:a=>{FS[a[1]]=FS[a[0]]||"";return""},mv:a=>{FS[a[1]]=FS[a[0]]||"";delete FS[a[0]];return""},move:a=>{FS[a[1]]=FS[a[0]]||"";delete FS[a[0]];return""},basename:a=>(a[0]||"").split("/").pop(),dirname:a=>(a[0]||"").split("/").slice(0,-1).join("/")||".",true:()=>"",false:()=>""};
const out=document.getElementById("out"),grid=document.getElementById("grid"),q=document.getElementById("q"),os=document.getElementById("os");
function resolve(raw){const t=raw.trim().split(/\\s+/),first=(t.shift()||"").toLowerCase();const m=DATA.find(x=>x.command.toLowerCase()===first||(x.aliases||[]).map(a=>a.toLowerCase()).includes(first));return{cmd:m?m.command:first,args:t}}
function execute(raw){const r=resolve(raw),fn=safe[r.cmd.toLowerCase()];if(fn){const v=fn(r.args);if(v!==undefined)out.textContent=v;return}out.textContent=r.cmd+": native execution required on "+os.value+".\\n\\n"+raw+"\\n\\nUse “Run in Chimera” for native execution."}
function runTyped(){execute(q.value)}function nativeRun(){const raw=q.value.trim();if(raw)location.href="chimera://command?os="+encodeURIComponent(os.value)+"&cmd="+encodeURIComponent(raw)}
function render(){const t=q.value.toLowerCase();grid.innerHTML=DATA.filter(x=>!t||(x.command+" "+(x.description||"")+" "+(x.aliases||[]).join(" ")).toLowerCase().includes(t)).slice(0,120).map(x=>'<article class="cmd"><b>'+esc(x.command)+'</b><div class="alias">'+esc((x.aliases||[]).join(" · "))+'</div><p class="muted">'+esc(x.description||"SS64 command")+'</p><small>'+esc(x.platform||"")+' · '+esc(x.source||"SS64")+'</small><br><button class="btn" onclick="q.value='+JSON.stringify(x.command)+';runTyped()">Run</button></article>').join("")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
fetch("ss64-command-catalog.json").then(r=>r.json()).then(d=>{DATA=d.commands||[];render()}).catch(()=>render());q.addEventListener("input",render);q.addEventListener("keydown",e=>{if(e.key==="Enter")runTyped()});
</script></body></html>
