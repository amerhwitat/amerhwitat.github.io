<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Interaction Hub</title><link rel="stylesheet" href="aurora-shared.css"><style>body{margin:0;font-family:system-ui;background:#07101d;color:#eef}.wrap{max-width:1280px;margin:auto;padding:28px}.hero,.card{background:rgba(20,35,55,.72);border:1px solid #294766;border-radius:18px;padding:20px;box-shadow:0 12px 40px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}.card h3{margin-top:0}.btn{display:inline-block;border:1px solid #416b92;border-radius:10px;padding:9px 12px;color:#fff;text-decoration:none;background:#10253b;cursor:pointer}.primary{background:#1b5684}.muted{opacity:.72}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.search{flex:1;min-width:240px;padding:11px;border-radius:10px;border:1px solid #416b92;background:#081522;color:#fff}.pill{display:inline-block;border:1px solid #416b92;border-radius:999px;padding:4px 8px;font-size:.78rem;margin:3px}</style></head><body><main class="wrap"><section class="hero"><span class="pill">AURORA · INTERACTION HUB</span><h1>Chimera II Web Workspace</h1><p class="muted">One interactive launch surface for Aurora tools, OS controls, research, emulation, Python, networking and wallet workflows.</p><div class="bar"><input id="search" class="search" placeholder="Search tools, capabilities, Python, emulator, OCR…"><button id="reset" class="btn">Reset</button><button id="export" class="btn">Export workspace map</button></div><div id="status" class="muted"></div></section><section id="grid" class="grid"></section></main><script src="aurora-interaction-hub.js"></script></body></html>
