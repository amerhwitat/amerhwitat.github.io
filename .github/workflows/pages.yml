name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-site:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test site-local link resolution
        run: python3 -m unittest scripts/test_check_site_links.py
      - name: Validate every app catalog destination
        run: python3 scripts/check_app_catalog.py
      - name: Check all published local links
        run: python3 scripts/check_site_links.py
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OctavianOS React web companion
        run: |
          set -euo pipefail
          cd apps/octavianos
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          rm -rf node_modules
          cd mobile
          npm install --no-audit --no-fund
          npm run typecheck
          rm -rf node_modules
          cd ../../..
          test -s apps/octavianos/mobile/App.tsx
          test -s apps/octavianos/mobile/app.json
      - name: Build SS64 command catalog
        run: python3 scripts/build_ss64_command_catalog.py
      - name: Package open-source SAE Amiga browser core
        run: |
          rm -rf apps/nlp-amiga/vendor
          mkdir -p apps/nlp-amiga/vendor
          git clone --depth 1 https://github.com/naTmeg/ScriptedAmigaEmulator.git apps/nlp-amiga/vendor/sae
          rm -rf apps/nlp-amiga/vendor/sae/.git
          cp apps/nlp-amiga/vendor/sae/gpl.htm apps/nlp-amiga/vendor/sae/LICENSE-GPL.html
          test -f apps/nlp-amiga/vendor/sae/sae/amiga.js
          echo "SAE browser core packaged: $(find apps/nlp-amiga/vendor/sae/sae -type f | wc -l) source files"
      - name: Package browser MAME core
        run: |
          rm -rf apps/chimera-ii-os/web/mame-core
          mkdir -p apps/chimera-ii-os/web/mame-core
          git clone --depth 1 https://github.com/lrusso/MAME.git /tmp/chimera-mame
          cp /tmp/chimera-mame/MAME.min.js apps/chimera-ii-os/web/mame-core/MAME.min.js
          printf '%s\n' 'Browser MAME source: https://github.com/lrusso/MAME' 'See upstream repository README and source licensing before redistribution.' > apps/chimera-ii-os/web/mame-core/UPSTREAM-NOTICE.txt
          test -s apps/chimera-ii-os/web/mame-core/MAME.min.js
          echo "Browser MAME core packaged: $(wc -c < apps/chimera-ii-os/web/mame-core/MAME.min.js) bytes"
      - name: Sync NLP ancient-language target catalog
        run: python3 scripts/sync_ancient_language_registry.py
      - name: Apply Aurora runtime to all pages
        run: python3 scripts/apply_aurora_runtime.py
      - name: Test site-local link resolution
        run: python3 -m unittest scripts/test_check_site_links.py
      - name: Check local site links
        run: python3 scripts/check_site_links.py
      - name: Validate every app catalog destination
        run: python3 scripts/check_app_catalog.py
      - name: Validate Wallet Python catalog
        run: python3 scripts/check_wallet_python_catalog.py
      - name: Validate Wallet Center JavaScript
        run: node --check apps/chimera-ii-os/web/wallet-center.js
      - name: Validate Game Center JavaScript
        run: node --check apps/chimera-ii-os/web/game-center.js
      - name: Validate Aurora Interaction Hub JavaScript
        run: node --check apps/chimera-ii-os/web/aurora-interaction-hub.js
      - name: Validate Aurora Ecosystem Center
        run: |
          python3 - <<'PY'
          import json
          p='apps/chimera-ii-os/web/aurora-ecosystem-catalog.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='aurora-ecosystem-catalog/v1'
          assert len(d['repositories']) >= 14
          assert len(d['builtIn']) >= 10
          print('Ecosystem catalog:',len(d['repositories']),'repos /',len(d['builtIn']),'apps')
          PY
          node --check apps/chimera-ii-os/web/aurora-ecosystem-center.js
          test -s apps/chimera-ii-os/web/aurora-ecosystem-center.html
          test -s apps/chimera-ii-os/web/aurora-ecosystem-catalog.json
      - name: Validate AAA Game Lab manifest
        run: python3 -c "import json; d=json.load(open('apps/chimera-ii-os/web/aaa-game-lab.json')); assert d['schema']=='aurora-aaa-game-lab/v1' and len(d['projects'])==3"
      - name: Validate Aurora Interaction Hub assets
        run: |
          test -f apps/chimera-ii-os/web/aurora-interaction-hub.html
          test -f apps/chimera-ii-os/web/aurora-interaction-hub.js
      - name: Validate repository application studio
        run: |
          test -s apps/chimera-ii-os/web/repository-app-studio.html
          test -s apps/chimera-ii-os/web/repository-app-studio.js
          node --check apps/chimera-ii-os/web/repository-app-studio.js
          grep -q 'bruteforce' apps/chimera-ii-os/web/repository-app-studio.js
          grep -q 'OctavianOS' apps/chimera-ii-os/web/repository-app-studio.js
          grep -q 'eth-key-check' apps/chimera-ii-os/web/repository-app-studio.js
          grep -q 'keygen' apps/chimera-ii-os/web/repository-app-studio.js
          grep -q 'general' apps/chimera-ii-os/web/repository-app-studio.js
          grep -q 'Guest' apps/chimera-ii-os/web/repository-app-studio.html
      - name: Validate MAME Arcade Center controls
        run: |
          test -s apps/chimera-ii-os/web/mame-center.html
          test -s apps/chimera-ii-os/web/mame-center.js
          test -s apps/chimera-ii-os/web/mame-game-db.json
          node --check apps/chimera-ii-os/web/mame-center.js
          python3 - <<'PY'
          import json
          data=json.load(open('apps/chimera-ii-os/web/mame-game-db.json',encoding='utf-8'))
          assert isinstance(data,list) and data, 'MAME catalogue must be a non-empty array'
          assert all({'id','title','system'} <= set(item) for item in data), 'MAME entries need id/title/system'
          print(f'MAME Arcade Center catalogue: {len(data)} entries')
          PY
      - name: Validate Aurora Emulator surface
        run: |
          test -s apps/chimera-ii-os/web/aurora-emulator.html
          grep -q 'Aurora Emulator' apps/chimera-ii-os/web/aurora-emulator.html
          grep -q 'aurora-emulator.html' apps/chimera-ii-os/web/aurora_3d_desktop.js
          grep -q 'aurora-emulator.html' index.html
      - name: Validate SS64 Arabic command runtime
        run: |
          test -s scripts/build_ss64_command_catalog.py
          node --check apps/chimera-ii-os/web/aurora-interaction-hub.js
          node --check apps/chimera-ii-os/web/aurora_3d_desktop.js
          grep -q 'ss64' apps/chimera-ii-os/web/aurora_3d_desktop.js
          grep -q 'العربية' apps/chimera-ii-os/web/command-console.html
      - name: Validate Chimera language runtime lab
        run: |
          test -s apps/chimera-ii-os/web/chimera-language-runtime.html
          test -s apps/chimera-ii-os/web/chimera-language-runtime.js
          test -s apps/chimera-ii-os/web/chimera-language-runtime-catalog.json
          node --check apps/chimera-ii-os/web/chimera-language-runtime.js
          python3 - <<'PY'
          import json
          p='apps/chimera-ii-os/web/chimera-language-runtime-catalog.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['totalTrackedFiles'] >= 700
          for k in ('asm','c','cpp','python','kotlin','java'): assert d['counts'].get(k,0)>0
          print('Language runtime catalog:',d['totalTrackedFiles'],'tracked files')
          PY
      - name: Validate Hercules artwork manifest
        run: |
          test -s apps/chimera-ii-os/web/hercules-artwork-manifest.json
          python3 - <<'PY'
          import json
          d=json.load(open('apps/chimera-ii-os/web/hercules-artwork-manifest.json',encoding='utf-8'))
          assert d['schema']=='aurora-hercules-artwork/v1'
          assert 'remote' in d['strategy'] and 'local' in d['strategy']
          print('Hercules artwork manifest: PASS')
          PY
      - name: Validate Hercules integration surface
        run: |
          test -s apps/chimera-ii-os/web/hercules-integration.html
          test -s apps/chimera-ii-os/web/hercules-integration.js
          node --check apps/chimera-ii-os/web/hercules-integration.js
          grep -q 'chimera-iios-120143.onhercules.app' apps/chimera-ii-os/web/hercules-integration.html
          grep -q 'Hercules Runtime' apps/chimera-ii-os/web/aurora-interaction-hub.js
      - name: Rebuild full-text search index
        run: python3 scripts/build_search_index.py
      - uses: actions/configure-pages@v5
      - name: Apply shared 3D icons and interaction sounds to all published HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          skipped = {".git", "node_modules", ".venv"}
          changed = 0
          for page in Path(".").rglob("*.html"):
              if any(part in skipped for part in page.parts):
                  continue
              try:
                  source = page.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = source
              if "site-interactions.css" not in updated and re.search(r"</head\s*>", updated, re.I):
                  updated = re.sub(r"</head\s*>", '  <link rel="stylesheet" href="/site-interactions.css?v=1">\n</head>', updated, count=1, flags=re.I)
              if "site-interactions.js" not in updated and re.search(r"</body\s*>", updated, re.I):
                  updated = re.sub(r"</body\s*>", '  <script src="/site-interactions.js?v=1" defer></script>\n</body>', updated, count=1, flags=re.I)
              if updated != source:
                  page.write_text(updated, encoding="utf-8")
                  changed += 1
          print(f"Injected shared icon/sound layer into {changed} HTML pages")
          if changed == 0:
              print("Existing includes may already cover all pages.")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
