name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SS64 command catalog
        run: python3 scripts/build_ss64_command_catalog.py
      - name: Apply Aurora runtime to all pages
        run: python3 scripts/apply_aurora_runtime.py
      - name: Check local site links
        run: python3 scripts/check_site_links.py
      - name: Rebuild full-text search index
        run: python3 scripts/build_search_index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
