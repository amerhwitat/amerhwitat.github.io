name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SS64 command catalog
        run: python3 scripts/build_ss64_command_catalog.py
      - name: Package open-source SAE Amiga browser core
        run: |
          rm -rf apps/nlp-amiga/vendor
          mkdir -p apps/nlp-amiga/vendor
          git clone --depth 1 https://github.com/naTmeg/ScriptedAmigaEmulator.git apps/nlp-amiga/vendor/sae
          rm -rf apps/nlp-amiga/vendor/sae/.git
          cp apps/nlp-amiga/vendor/sae/gpl.htm apps/nlp-amiga/vendor/sae/LICENSE-GPL.html
          test -f apps/nlp-amiga/vendor/sae/sae/amiga.js
          echo "SAE browser core packaged: $(find apps/nlp-amiga/vendor/sae/sae -type f | wc -l) source files"
      - name: Package browser MAME core
        run: |
          rm -rf apps/chimera-ii-os/web/mame-core
          mkdir -p apps/chimera-ii-os/web/mame-core
          git clone --depth 1 https://github.com/lrusso/MAME.git /tmp/chimera-mame
          cp /tmp/chimera-mame/MAME.min.js apps/chimera-ii-os/web/mame-core/MAME.min.js
          printf '%s\n' 'Browser MAME source: https://github.com/lrusso/MAME' 'See upstream repository README and source licensing before redistribution.' > apps/chimera-ii-os/web/mame-core/UPSTREAM-NOTICE.txt
          test -s apps/chimera-ii-os/web/mame-core/MAME.min.js
          echo "Browser MAME core packaged: $(wc -c < apps/chimera-ii-os/web/mame-core/MAME.min.js) bytes"
      - name: Sync NLP ancient-language target catalog
        run: python3 scripts/sync_ancient_language_registry.py
      - name: Apply Aurora runtime to all pages
        run: python3 scripts/apply_aurora_runtime.py
      - name: Check local site links
        run: python3 scripts/check_site_links.py
      - name: Validate Wallet Python catalog
        run: python3 scripts/check_wallet_python_catalog.py
      - name: Validate Wallet Center JavaScript
        run: node --check apps/chimera-ii-os/web/wallet-center.js
      - name: Rebuild full-text search index
        run: python3 scripts/build_search_index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
