name: Static hub catalog validation

on:
  pull_request:
    paths:
      - "index.html"
      - "apps/project-workbench.html"
      - "scripts/check_project_workbench.py"
      - "search-index.json"
      - "scripts/build_search_index.py"
      - "scripts/check_site_links.py"
      - "scripts/check_app_catalog.py"
      - "apps/chimera-ii-os/web/**"
      - "apps/cpu4096-simulator/public/**"
      - "apps/octavianos/**"
      - "apps/thamudic-scanner/**"
      - "apps/repository-app-explorer/**"
      - "scripts/test_repository_app_explorer.py"
      - "scripts/test_octavian_provider_checks.py"
      - "site-interactions.css"
      - "site-interactions.js"
      - ".github/workflows/pages.yml"
      - ".github/workflows/site-catalog-check.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "apps/project-workbench.html"
      - "scripts/check_project_workbench.py"
      - "search-index.json"
      - "scripts/build_search_index.py"
      - "scripts/check_site_links.py"
      - "apps/chimera-ii-os/web/**"
      - "apps/cpu4096-simulator/public/**"
      - "apps/octavianos/**"
      - "apps/thamudic-scanner/**"
      - ".github/workflows/site-catalog-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild full-text index
        run: python3 scripts/build_search_index.py
      - name: Validate project workbench
        run: python3 scripts/check_project_workbench.py
      - name: Validate app and repository catalog
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          apps_raw = re.search(r"const APPS = (.*?);\nconst REPOS = ", html, re.S)
          repos_raw = re.search(r"const REPOS = (.*?);\n\nconst esc", html, re.S)
          assert apps_raw and repos_raw, "APPS/REPOS catalog declarations missing"
          apps, repos = json.loads(apps_raw.group(1)), json.loads(repos_raw.group(1))
          titles = {a["title"] for a in apps}
          assert "ThamudicScan v2.4.1 — Scanner" in titles
          assert "Chimera II OS — Hosted Aurora Desktop" in titles
          assert "Chimera II OS Web Apps — 154-file inventory" in titles
          assert any(r["title"] == "ChimeraIIOS" for r in repos)
          assert any(r["title"] == "amerhwitat.github.io" for r in repos)
          assert any(r["title"] == "OctavianOS" for r in repos)
          assert any(a["title"] == "Repository App Explorer" and a["path"] == "apps/repository-app-explorer/index.html" for a in apps)
          assert Path("apps/repository-app-explorer/index.html").is_file()
          assert "OctavianOS Aurora Wayland Glass — Web Preview" in titles
          assert "OctavianOS Marine Desktop — Web Preview" in titles
          assert any(a["path"] == "apps/chimera-ii-os/web/command-console.html" for a in apps)
          assert any(a["path"] == "apps/cpu4096-simulator/public/chimera_code_ide.html" for a in apps)
          assert Path("apps/octavianos/aurora/index.html").is_file()
          assert Path("apps/octavianos/marine/index.html").is_file()
          index = json.loads(Path("search-index.json").read_text(encoding="utf-8"))
          pages = index["pages"]
          assert len(pages) == len({p["p"] for p in pages}), "Duplicate search-index destinations"
          assert any(p["t"] == "ThamudicScan v2.4.1 — Ancient North Arabian Scanner" for p in pages)
          assert any(p["p"].startswith("https://chimera-iios-120143.onhercules.app") for p in pages)
          assert any("154-file inventory" in p["t"] for p in pages)
          assert any(p["p"] == "apps/octavianos/aurora/index.html" for p in pages)
          assert any(p["p"] == "apps/octavianos/marine/index.html" for p in pages)
          for title in ("General Integration & Application Index", "BizX — Cross-platform Game Framework", "CPU4096 — Multi-language Simulator", "NLP & Ancient North Arabian Toolkit", "Java / Koronos Research Runtime", "AgentResearchForge", "SEO-Tool", "WorkflowStudio"):
            assert any(p["t"] == title for p in pages), f"Missing repository app in search index: {title}"
          print(f"PASS: {len(apps)} apps, {len(repos)} repositories, {len(pages)} indexed pages")
          PY
      - name: Validate shared interaction and MAME frontend scripts
        run: |
          node --check site-interactions.js
          node --check apps/chimera-ii-os/web/mame-center.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('apps/chimera-ii-os/web/mame-game-db.json').read_text(encoding='utf-8'))
          assert isinstance(data,list) and data
          assert all({'id','title','system'} <= set(x) for x in data)
          page=Path('apps/chimera-ii-os/web/mame-center.html').read_text(encoding='utf-8')
          for ident in ('scan','roms','loadCore','launch','pause','reset','fullscreen','save','load','sound','coin','p1','map','db','log'):
              assert f'id="{ident}"' in page, f'Missing control {ident}'
          print(f'PASS: shared interactions and MAME controls; {len(data)} catalogue entries')
          PY
      - name: Validate Aurora App Studio scripts and internal launch routes
        run: |
          node --check apps/chimera-ii-os/web/repository-app-studio.js
          node scripts/test_app_studio_generators.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("apps/chimera-ii-os/web/repository-app-studio.js").read_text(encoding="utf-8")
          page = Path("apps/chimera-ii-os/web/repository-app-studio.html").read_text(encoding="utf-8")
          paths = set(re.findall(r'["\'](/[^"\' ]+\.html|/[^"\' ]+/index\.html|/)["\']', source))
          paths.update(re.findall(r'href="([^"]+\.html)"', page))
          missing = []
          for path in paths:
              if path.startswith(("http://", "https://", "mailto:")):
                  continue
              if path.startswith("/"):
                  relative = path.lstrip("/")
              else:
                  relative = str(Path("apps/chimera-ii-os/web") / path)
              if relative and not Path(relative).is_file():
                  missing.append(path)
          assert not missing, "Missing Aurora App Studio routes: " + ", ".join(sorted(missing))
          for target in ("vite-react", "angular", "react-native"):
              assert target in source, "Missing framework exporter target: " + target
          assert "const featureRecords=[" in source and "Userspace handoff verifier" in source
          print(f"PASS: App Studio script syntax, {len(paths)} internal routes, 3 framework targets")
          PY
      - name: Build OctavianOS React app for local-link validation
        run: |
          cd apps/octavianos
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          rm -rf node_modules
          cd mobile
          npm install --no-audit --no-fund
          npm run typecheck
          rm -rf node_modules
      - name: Test repository explorer contract
        run: python3 -m unittest scripts/test_repository_app_explorer.py
      - name: Test OctavianOS provider availability and launch states
        run: python3 -m unittest scripts/test_octavian_provider_checks.py
      - name: Test site-local link resolution
        run: python3 -m unittest scripts/test_check_site_links.py
      - name: Check local site links
        run: python3 scripts/check_site_links.py
      - name: Validate every app catalog destination
        run: python3 scripts/check_app_catalog.py
